name: Flutter Integration Test (Android Emulator)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integration-test:
    name: Run Integration Tests on Android Emulator
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout the repository
        uses: actions/checkout@v3

      # Install Java (required by Android)
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      # Install Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"

      # Install Android SDK
      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      # Create AVD (Android Emulator)
      - name: Create Android Emulator
        run: |
          echo "no" | avdmanager create avd \
            --name "Pixel_6" \
            --package "system-images;android-30;google_apis;x86_64" \
            --device "pixel_6"

      # Start Emulator
      - name: Start Emulator
        run: |
          $ANDROID_HOME/emulator/emulator -avd Pixel_6 -no-audio -no-window -gpu swiftshader_indirect &

      # Wait until emulator boots completely
      - name: Wait for emulator
        run: |
          adb wait-for-device
          adb shell getprop sys.boot_completed | grep 1

      # Enable Flutter webview/integration & dependencies, etc
      - name: Flutter pub get
        run: flutter pub get
      
      # 일반 단위/위젯 테스트
      - name: Run flutter test (unit/widget)
        run: flutter test

      # Run the integration tests
      - name: Run integration tests
        run: flutter test integration_test