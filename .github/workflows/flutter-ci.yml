name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # -----------------------------
      # 1) Unit & Widget Tests (CI)
      # -----------------------------
      - name: Run Unit/Widget Tests
        run: |
          flutter test --machine test/ > test_output.log
          cat test_output.log | tojunit -o unit_widget_results.xml

      - name: Upload Unit/Widget Test Results
        uses: actions/upload-artifact@v4
        with:
          name: unit_widget_results
          path: unit_widget_results.xml